services:
    postgres:
        container_name: postgres
        image: postgres:16.8-alpine
        user: root
        ports:
            - 5432:5432
        volumes:
            - postgres:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: ${PGDATABASE}
            POSTGRES_USER: ${PGUSER}
            POSTGRES_PASSWORD: ${PGPASSWORD}
    pnpm:
        container_name: pnpm
        image: gplane/pnpm:10.6.5-alpine
        user: root
        working_dir: /app
        volumes:
            - ./package.json:/app/package.json
            - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
            - ./.env:/app/.env:ro
            - ./esbuild.config.js:/app/esbuild.config.js:ro
            - ./run.js:/app/run.js:ro
            - ./src:/app/src:ro
            - ./assets:/app/assets
            - ./public:/app/public
        command: sh -c "pnpm i && pnpm dev"
    composer:
        container_name: composer
        image: composer:2.8.7
        user: root
        working_dir: /app
        volumes:
            - ./composer.json:/app/composer.json
            - ./composer.lock:/app/composer.lock
            - ./vendor:/app/vendor
        command: sh -c "composer i && exit 1"
    php:
        container_name: php
        user: root
        build:
            context: php/
            dockerfile: Dockerfile
        working_dir: /app
        volumes:
            - ./public:/app/public:ro
            - ./avatar:/app/avatar:ro
            - ./src:/app/src:ro
            - ./svg:/app/svg:ro
            - ./vendor:/app/vendor:ro
            - avatars:/app/avatars
            - ./.env:/app/.env:ro
            - ./php/config.ini:/app/php.ini:ro
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
        depends_on:
            - postgres
            - pnpm
            - composer
    golang:
        container_name: golang
        image: golang:1.23.10-alpine3.21
        user: root
        working_dir: /app
        volumes:
            - ./go.mod:/app/go.mod:ro
            - ./go.sum:/app/go.sum:ro
            - ./golang/src/main.go:/app/src/main.go:ro
        depends_on:
            - php
        command: sh -c "go get ./... && go run src/main.go"
    nginx:
        container_name: nginx
        user: root
        build:
            context: nginx/
            dockerfile: Dockerfile
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./nginx/.htpasswd:/etc/nginx/.htpasswd
        depends_on:
            - php
    varnish:
        container_name: varnish
        image: varnish:7.7.0-alpine
        user: root
        ports:
            - 63342:80
        volumes:
            - ./varnish/config.vcl:/etc/varnish/default.vcl:ro
        depends_on:
            - php
    pgadmin:
        container_name: pgadmin
        image: dpage/pgadmin4:9.4.0
        user: root
        volumes:
            - pgadmin:/var/lib/pgadmin
            - ./pgadmin/config.py:/pgadmin4/config_local.py
        environment:
            SCRIPT_NAME: /admin/postgres
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: admin
        depends_on:
            - php
volumes:
    postgres:
        name: postgres
    avatars:
        name: avatars
    pgadmin:
        name: pgadmin
networks:
    default:
        name: app
